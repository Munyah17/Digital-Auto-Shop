<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your account — Digital Auto Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="header" style="position:static">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
        <span class="logo-text">Digital<em>Auto</em>Shop</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="account.html" class="nav-link active">Account</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button>
        <a href="checkout.html" class="icon-btn cart-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="account.html" class="active">Account</a>
      <a href="checkout.html">Checkout</a>
    </div>
  </header>

  <main class="portal">
    <div class="portal-head">
      <div>
        <h1 id="acctName">Your account</h1>
        <p id="acctMeta"></p>
      </div>
      <button class="btn btn-line" id="signOut" type="button">Sign out</button>
    </div>
    <div class="portal-stats" id="acctStats"></div>
    <h2 style="font-family:var(--font-head);font-size:1.05rem;margin-bottom:12px">Orders &amp; transactions</h2>
    <div id="orderList"></div>
  </main>
  <script src="cart.js"></script>
  <script src="page.js"></script>
  <script src="session.js"></script>
  <script src="account.js"></script>
</body>
</html>
